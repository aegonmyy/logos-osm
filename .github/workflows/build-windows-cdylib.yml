name: Build Windows cdylib

# Cross-builds logos_osm.dll from Linux with the posix-thread mingw
# toolchain (the MSVC route is blocked: rapidsnark has no windows-msvc
# prebuilt; Ubuntu's default win32-threads mingw breaks rocksdb's
# std::mutex). scripts/build-windows-cdylib.sh is the full recipe.
#
# Output: workflow artifact "logos_osm_dll". After downloading: commit to
# module/vendor/x86_64-windows/, bump the module version, push, and
# dispatch the release workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Build the cdylib (mingw-posix cross; downloads static libs)
        shell: bash
        run: ./scripts/build-windows-cdylib.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: logos_osm_dll
          path: target/x86_64-pc-windows-gnu/release/logos_osm.dll
          if-no-files-found: error
