name: Build Windows cdylib

# Builds liblogos_osm (logos_osm.dll) natively on Windows so it can be
# vendored into module/vendor/x86_64-windows/ and bundled in the .lgx
# (the Linux cross route is blocked: rapidsnark ships no
# x86_64-pc-windows-gnu asset mapping).
#
# Output: workflow artifact "logos_osm.dll".
# After downloading: commit to module/vendor/x86_64-windows/, bump the
# module version, push, and dispatch the release workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned by rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install native build deps (protoc for the LEZ wallet)
        shell: pwsh
        run: choco install -y --no-progress protoc --version=25.2 2>$null; Write-Host "protoc step done"

      - name: Build the cdylib
        shell: bash
        run: cargo build -p logos-osm --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: logos_osm_dll
          path: target/release/logos_osm.dll
          if-no-files-found: error
