[package]
name = "logos-osm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Reusable OSM registry SDK: Geofabrik discovery, Logos Storage hosting, MD5 verification, and the LEZ registry client."

[lib]
name = "logos_osm"
crate-type = ["lib", "cdylib"]

[dependencies]
# One source of truth for the closed region set + shared registry types,
# shared with the RISC0 guest (which embeds them on-chain).
osm-core = { path = "../methods/osm-core" }
lee.workspace = true
lee_core.workspace = true
# AccountIdentity for mapping built txs onto wallet signing sets.
wallet.workspace = true
sequencer_service_rpc.workspace = true
risc0-zkvm.workspace = true
sha2.workspace = true
md-5.workspace = true
hex.workspace = true
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
bytes.workspace = true
tokio-util.workspace = true
tracing.workspace = true

# md5-asm does not support Windows targets; gate the asm feature to
# non-Windows (the pure-Rust implementation is fine there).
[target.'cfg(not(windows))'.dependencies]
md-5 = { workspace = true, features = ["asm"] }

# Windows: rapidsnark has no shared library, and prebuilts exist only for
# the GNU toolchain (the Logos fork's static archives). Declaring the dep
# here with the feature turns it on for the whole graph via feature
# unification — but ONLY on Windows targets, so Linux keeps the shared-lib
# path that v1.1.0 already ships.
[target.'cfg(windows)'.dependencies]
rust-rapidsnark = { git = "https://github.com/logos-blockchain/logos-blockchain-rust-rapidsnark.git", rev = "e91187f8ccb5bbfc7bb00dac88169112428da78f", features = ["static-rapidsnark"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The example derives the deployed program id for the registration tx.
osm-registry = { path = "../methods/osm-host" }

[[example]]
name = "host_region"
path = "examples/host_region.rs"
