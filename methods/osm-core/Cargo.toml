[package]
name = "osm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared on-chain types for the OSM registry LEZ program."

[dependencies]
borsh.workspace = true
serde.workspace = true
sha2.workspace = true
# Decoding/encoding shard data uses the same non-borsh-array byte container the
